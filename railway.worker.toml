# Serviço "worker" no Railway (ADR 0019). No dashboard, aponte o "Config as
# Code Path" deste serviço para este arquivo. Fila contínua de verdade — nunca
# uma requisição HTTP espera por ela (CLAUDE.md §20).
#
# ⚠️ Mesma pendência de descontinuação do railway.api.toml — ver ADR 0019.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/entrypoint.sh worker"
restartPolicyType = "ALWAYS"
