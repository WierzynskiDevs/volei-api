# Render Blueprint — CLAUDE.md §14/§20: fila assíncrona sem worker contínuo
# grátis, drenada por Cron Job. Banco (Neon) e Redis não são provisionados
# aqui — são externos, ver docs/adr/0012-hospedagem-e-deploy.md.
services:
  - type: web
    name: saque-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - fromGroup: saque-shared

  - type: cron
    name: saque-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /entrypoint.sh queue
    # A cada minuto: latência máxima de processamento de webhook/fila (ver ADR).
    schedule: "* * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - fromGroup: saque-shared
